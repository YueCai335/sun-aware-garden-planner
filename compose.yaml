services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: garden_planner
      POSTGRES_USER: garden
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - garden-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garden -d garden_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://garden@database:5432/garden_planner
      FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      UPLOADS_DIR: /app/uploads
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - garden-health-photos:/app/uploads

volumes:
  garden-postgres-data:
  garden-health-photos:
