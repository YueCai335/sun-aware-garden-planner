services:
  - type: web
    name: sun-aware-garden-planner-api
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: pip install .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: PORTFOLIO_DEMO_MODE
        value: "true"
